version: "3.9"

services:
  demo-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: pqc-demo-app:latest
    container_name: pqc-demo-app
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DEMO_CERT_FILE: "/app/certs/demo.crt"
      DEMO_KEY_FILE:  "/app/certs/demo.key"
      PYTHONUNBUFFERED: "1"
    restart: unless-stopped
    # Run as non-root (uid 1001 defined in Dockerfile)
    user: "1001"
    read_only: false
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
